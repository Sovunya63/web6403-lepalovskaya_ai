<h1>Мои любимые мемы</h1>

<p>Золотой фонд мемов</p>

<div class="gallery">

    <div class="meme meme_gallery">
        <img
                src="images/img2.jpg"
                alt="Мем возможно сегодня не стоило быть трезвым"
                class="meme__image"
        >
        <p class="meme__text">ни сегодня, ни завтра, ни вчера</p>
    </div>

    <div class="meme meme_gallery">
        <img
                src="images/img3.jpg"
                alt="Мем возьмут ли в рай без диплома"
                class="meme__image"
        >
        <p class="meme__text">мой научник спросил: магистратура это рай?</p>
    </div>

    <div class="meme meme_gallery">
        <img
                src="images/img4.jpg"
                alt="Мем чем я печатаю оскорбления"
                class="meme__image"
        >
        <p class="meme__text">разнесу эту шарашкину контору</p>
    </div>

    <div class="meme meme_gallery">
        <img
                src="images/img5.jpg"
                alt="Мем эм эт че"
                class="meme__image"
        >
        <p class="meme__text">эм эт че</p>
    </div>

    <div class="meme meme_gallery">
        <img
                src="images/img6.jpg"
                alt="мем про будильник"
                class="meme__image"
        >
        <p class="meme__text">ненавижу вставать по утрам</p>
    </div>

    <div class="meme meme_gallery">
        <img
                src="images/img7.jpg"
                alt="мем привет"
                class="meme__image"
        >
        <p class="meme__text">привет кот</p>
    </div>

    <div class="meme meme_gallery">
        <img
                src="images/img8.jpg"
                alt="мем как би стать"
                class="meme__image"
        >
        <p class="meme__text">вопрос актуальный</p>
    </div>
</div>
</body>
</html>
