<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить мем</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav__link">
        <img src="icons/home.png" class="nav__icon" alt="">
        Главная
    </a>

    <a href="memes.html" class="nav__link">
        <img src="icons/gallery.png" class="nav__icon" alt="">
        Подборка мемов
    </a>

    <a href="grade.html" class="nav__link">
        <img src="icons/grade.png" class="nav__icon" alt="">
        Оценка мемов
    </a>

    <a href="addmeme.html" class="nav__link nav__link_active">
        <img src="icons/add.png" class="nav__icon" alt="">
        Добавить мем
    </a>
</nav>

<h1>Предложить мем</h1>

<form id="meme-form">
    <label for="title">Название мема:</label>
    <input
            type="text"
            id="title"
            name="title"
            required
    >

    <label for="link">Ссылка на мем:</label>
    <input
            type="url"
            id="link"
            name="link"
            required
    >

    <label for="rating">Оценка:</label>
    <input
            type="number"
            id="rating"
            name="rating"
            min="1"
            max="10"
            required
    >

    <label class="checkbox-label">
        <input
                type="checkbox"
                id="agreement"
                required
        >
        Подтверждаю, что мем действительно смешной
    </label>

    <button type="submit">Отправить</button>
</form>

<script src="script.js"></script>

</body>
</html>
